# Publishes the Java SDK (sdk/java, com.cdpfleet:cdpfleet) to Maven Central when a tag like
# java-v0.1.0 is pushed. Needs the com.cdpfleet namespace verified on central.sonatype.com,
# a Central user token (MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD) and a GPG key
# (GPG_PRIVATE_KEY / GPG_PASSPHRASE) whose public half is on keyserver.ubuntu.com.
name: publish-java
on:
  push:
    tags: ['java-v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Tag matches project version
        run: test "java-v$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "${GITHUB_REF_NAME}"
      - run: mvn -B -P release deploy -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
