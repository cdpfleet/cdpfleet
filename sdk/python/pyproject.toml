[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cdpfleet"
version = "0.1.0"
description = "Launch real remote browsers on cdpfleet and drive them with your own Playwright."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["playwright", "browser", "cdp", "scraping", "automation", "headless", "cdpfleet"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://cdpfleet.com/docs/sdk"
Repository = "https://github.com/cdpfleet/cdpfleet"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdpfleet = ["py.typed"]
